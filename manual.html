<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>ELPP Scanner Manual</title>
<style>
:root{--bg:#0e1320;--fg:#e8ecf6;--mut:#8b96b0;--acc:#e8a317}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#bar{position:sticky;top:0;z-index:5;background:#141b2e;border-bottom:1px solid #26314d;padding:8px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:14px}
#bar b{color:var(--acc)} #bar span{color:var(--mut)}
#pages{display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px 8px 40px}
canvas{max-width:100%;height:auto;background:#fff;box-shadow:0 2px 14px #0008;pointer-events:none}
.pg{position:relative;max-width:100%}
.wm{position:absolute;inset:0;pointer-events:none;overflow:hidden;opacity:.07;color:#000;font:700 26px sans-serif;transform:rotate(-30deg) scale(1.6);display:flex;flex-wrap:wrap;gap:60px;align-content:center;justify-content:center}
#msg{text-align:center;padding:40px;color:var(--mut)}
@media print{body{display:none!important}}
</style></head><body oncontextmenu="return false">
<div id="bar"><div><b>ELPP Crypto Scanner Pro</b> <span>· User manual</span></div><span id="pn">Loading…</span></div>
<div id="msg">Loading the manual…</div><div id="pages"></div>
<script src="manual-data.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function(){
  var stop = function(e){ e.preventDefault(); e.stopPropagation(); return false; };
  ['contextmenu','selectstart','dragstart','copy','cut'].forEach(function(t){ document.addEventListener(t, stop, true); });
  document.addEventListener('keydown', function(e){ var k = (e.key || '').toLowerCase(); if ((e.ctrlKey || e.metaKey) && ['s','p','u','c','a','o'].indexOf(k) >= 0) return stop(e); if (k === 'f12' || ((e.ctrlKey || e.metaKey) && e.shiftKey && ['i','j','c'].indexOf(k) >= 0)) return stop(e); if (k === 'printscreen'){ try { navigator.clipboard.writeText(''); } catch(_){} } }, true);
  window.addEventListener('beforeprint', function(){ document.body.style.display = 'none'; }); window.addEventListener('afterprint', function(){ document.body.style.display = ''; });
  var msg = document.getElementById('msg');
  function fail(t){ msg.textContent = t; }
  if (!window.pdfjsLib || !window.__MD) return fail('The manual could not load. Check your internet connection and open it again.');
  var V = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  fetch(V).then(function(r){ return r.text(); }).then(function(t){
    pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([t], {type:'text/javascript'}));
    var bin = atob(window.__MD.join('')), u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); window.__MD = null;
    return pdfjsLib.getDocument({data: u}).promise;
  }).then(function(doc){
    msg.remove(); var box = document.getElementById('pages'), pn = document.getElementById('pn'), n = doc.numPages, tag = 'ELPP · licensed manual · '; pn.textContent = n + ' pages';
    var holders = [], seen = new Set();
    function draw(i){ if (seen.has(i)) return; seen.add(i); doc.getPage(i).then(function(p){ var sc = Math.min(2, (window.devicePixelRatio || 1) * 1.3), vp = p.getViewport({scale: sc}), c = holders[i - 1].querySelector('canvas'); c.width = vp.width; c.height = vp.height; return p.render({canvasContext: c.getContext('2d'), viewport: vp}).promise; }); }
    for (var i = 1; i <= n; i++){ var h = document.createElement('div'); h.className = 'pg'; h.style.width = 'min(100%, 820px)'; h.style.aspectRatio = '595.92 / 842.88'; var c = document.createElement('canvas'); c.style.width = '100%'; h.appendChild(c); var w = document.createElement('div'); w.className = 'wm'; var s = ''; for (var k = 0; k < 14; k++) s += '<span>' + tag + '</span>'; w.innerHTML = s; h.appendChild(w); h.dataset.i = i; box.appendChild(h); holders.push(h); }
    var io = new IntersectionObserver(function(es){ es.forEach(function(e){ if (e.isIntersecting){ var i = +e.target.dataset.i; draw(i); if (i < n) draw(i + 1); pn.textContent = 'Page ' + i + ' of ' + n; } }); }, {rootMargin: '600px 0px'});
    holders.forEach(function(h){ io.observe(h); });
  }).catch(function(e){ fail('The manual could not load (' + (e && e.message || e) + ').'); });
})();
</script></body></html>
