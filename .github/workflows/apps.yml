name: build-apps
on:
  workflow_dispatch:
  push:
    paths: ['apps/**', '.github/workflows/apps.yml']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build Windows app
        working-directory: apps/desktop
        run: |
          npm install
          npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            apps/desktop/dist/*.exe
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Build Android app
        working-directory: apps/mobile
        run: |
          npm install
          npx cap add android
          npx capacitor-assets generate --android || echo "icon generation skipped"
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mkdir -p ../out && cp app/build/outputs/apk/debug/app-debug.apk ../out/ELPP-Scanner.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: apps/mobile/out/ELPP-Scanner.apk
  release:
    needs: [windows, android]
    if: always() && (needs.windows.result == 'success' || needs.android.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: files }
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find files -type f
          gh release delete apps-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create apps-latest --repo "$GITHUB_REPOSITORY" --title "ELPP apps (latest)" --notes "Windows installer and Android app. They open the live site, so site updates appear automatically." $(find files -type f)
