name: refresh-data
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download calendar and FRED series
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          mkdir -p data
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36'
          for w in thisweek nextweek; do
            for i in 1 2 3; do
              curl -sfL -A "$UA" --max-time 30 "https://nfs.faireconomy.media/ff_calendar_$w.json" -o "data/tmp_$w.json" && python3 -c "import json;assert isinstance(json.load(open('data/tmp_$w.json')),list)" && mv "data/tmp_$w.json" "data/ff_$w.json" && break
              sleep 20
            done
            rm -f "data/tmp_$w.json"
          done
          if [ -z "$FRED_API_KEY" ]; then echo "FRED_API_KEY secret is missing or empty"; fi
          for id in GASREGW ADPMNUSNERSA IC4WSA; do
            if [ -n "$FRED_API_KEY" ]; then
              code=$(curl -s -o data/tmp.json -w '%{http_code}' --max-time 40 "https://api.stlouisfed.org/fred/series/observations?series_id=$id&api_key=$FRED_API_KEY&file_type=json&observation_start=2023-01-01")
              echo "FRED $id -> HTTP $code"
              if [ "$code" = "200" ]; then
                python3 - "$id" <<'PY'
import json,sys
i=sys.argv[1]
j=json.load(open('data/tmp.json'))
rows=[o for o in j.get('observations',[]) if o.get('value') not in ('.','',None)]
if len(rows)>=3:
    open('data/fred_%s.csv'%i,'w').write('observation_date,%s\n'%i+''.join('%s,%s\n'%(o['date'],o['value']) for o in rows))
    print('saved',i,len(rows),'rows, last',rows[-1]['date'])
else:
    print('no usable rows for',i, str(j)[:120])
PY
              else head -c 200 data/tmp.json; echo; fi
            fi
            rm -f data/tmp.json
          done
          date -u +%FT%TZ > data/updated.txt
      - name: Commit
        run: |
          git config user.name "elpp-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "data refresh" && git push)
